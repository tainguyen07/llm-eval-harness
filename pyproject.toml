[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-eval-harness"
version = "0.4.2"
description = "Production-grade evaluation harness for LLM applications: prompt versioning, dataset runners, LLM-as-judge scoring, regression tracking, and HTML reports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tai Nguyen" }]
keywords = ["llm", "evaluation", "benchmark", "llm-as-judge", "prompt-engineering", "regression"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "click>=8.1",
    "rich>=13.7",
    "jinja2>=3.1",
    "httpx>=0.27",
    "tenacity>=8.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "python-dateutil>=2.8",
    "typing-extensions>=4.10",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.28"]
all = ["openai>=1.30", "anthropic>=0.28"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "mypy>=1.10",
    "ruff>=0.4",
    "black>=24.4",
    "isort>=5.13",
    "pre-commit>=3.7",
    "types-PyYAML",
    "types-requests",
]

[project.urls]
Homepage = "https://github.com/tainguyen/llm-eval-harness"
Repository = "https://github.com/tainguyen/llm-eval-harness"
Issues = "https://github.com/tainguyen/llm-eval-harness/issues"
Changelog = "https://github.com/tainguyen/llm-eval-harness/blob/main/CHANGELOG.md"

[project.scripts]
llm-eval = "llm_eval_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_eval_harness = ["py.typed", "templates/*.html", "templates/*.md.j2"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config --cov=llm_eval_harness --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: marks integration tests that hit real services",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.coverage.run]
branch = true
source = ["llm_eval_harness"]
omit = ["*/tests/*", "*/examples/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]